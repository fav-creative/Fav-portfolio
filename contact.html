<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Fav for professional web design services">
  <title>Contact | Fav</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a class="logo" href="index.html">
        <img src="bxn1.jpeg" alt="Fav logo">
      </a>

      <nav aria-label="Main navigation">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="about.html">About</a></li>
          <li><a class="active" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container contact-page">
    <section class="page-title">
      <h1>Let's Work Together</h1>
      <p>Have an idea? Send me a message and let's bring it to life.</p>
    </section>

    <form id="contact-form" class="contact-form" novalidate>
      <h2>Get in Touch</h2>
      
      <div class="form-row">
        <div class="form-group">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="service">Project size</label>
        <select id="service" name="service" required>
          <option value="">Select an option</option>
          <option value="small">Small project</option>
          <option value="medium">Medium project</option>
          <option value="large">Large project</option>
        </select>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" placeholder="What would you like to discuss?" required>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Tell me about your project..." required></textarea>
      </div>

      <button class="btn submit-btn" type="submit">Send Message</button>
      <p id="form-status" class="form-status" role="status"></p>
    </form>
    <div class="form-content">
          <p>📍 Lagos, Nigeria</p>
          <p>📞 +234 800 123 4567</p>
          <p>✉️ info@primenestrealty.com</p>
          <a href="https://wa.me/2348001234567" target="_blank" class="btn whatsapp-btn">
            💬 Chat via WhatsApp
          </a>
        </div>
  </main>

  <footer>
    <em>© <span id="current-year"></span> Fav's Creative</em>
  </footer>

</body>
</html>
